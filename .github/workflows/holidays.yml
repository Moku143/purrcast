name: Holidays

# The 날씨 달력's public holidays on the server, kept fresh: every Monday (and by hand, or by pushing to holidays-run)
# the open-source `holidays` package's newest tables (substitute days, elections, newly set 임시공휴일) go to the
# server's HOLIDAYS store — only the countries that changed (tools/holidays/upload.mjs). No code is deployed.
on:
  schedule:
    - cron: '17 18 * * 0'      # Monday 03:17 in Korea
  push:
    branches: [holidays-run]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Make and upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install --quiet --upgrade holidays
          python3 tools/holidays/make.py --split holidays-out
          node tools/holidays/upload.mjs holidays-out | tee -a "$GITHUB_STEP_SUMMARY"
