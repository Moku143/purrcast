name: Compare sources
# 기상청 vs Apple 날씨 (and MET) for a few Korean places, right now. Result → cmp-output branch (compare.txt).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Compare
        working-directory: server
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          WEATHERKIT_KEY_ID: ${{ secrets.WEATHERKIT_KEY_ID }}
          WEATHERKIT_KEY_P8: ${{ secrets.WEATHERKIT_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ../out
          node scripts/compare-sources.mjs 2>&1 | tee ../out/compare.txt; true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} $(date -u)" > ../out/RUN.txt
      - name: Publish
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b cmp-output
          git add -A && git -c user.name=ci -c user.email=ci@purrcast commit -q -m "compare ${{ github.run_id }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} cmp-output
