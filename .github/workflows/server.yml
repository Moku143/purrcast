name: Server

on:
  push:
    branches: [main]
    paths: ['server/**', 'Shared/Data/scenes.json', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tests (fake upstreams)
        working-directory: server
        run: node --test test/*.test.js
      - name: Live check against MET Norway (and 기상청 / WeatherKit when the keys are set)
        working-directory: server
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          WEATHERKIT_KEY_ID: ${{ secrets.WEATHERKIT_KEY_ID }}
          WEATHERKIT_KEY_P8: ${{ secrets.WEATHERKIT_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/live-check.mjs | tee live.txt
      - name: Publish the live check
        if: always()
        run: |
          mkdir -p out && cp server/live.txt out/ 2>/dev/null || echo "live check did not run" > out/live.txt
          echo "run=${{ github.run_id }} sha=${{ github.sha }} $(date -u)" > out/RUN.txt
          cd out && git init -q && git checkout -q -b server-output
          git add -A && git -c user.name=ci -c user.email=ci@purrcast commit -q -m "server check ${{ github.run_id }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} server-output

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy to Cloudflare (skipped until the secrets exist)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          WEATHERKIT_KEY_ID: ${{ secrets.WEATHERKIT_KEY_ID }}
          WEATHERKIT_KEY_P8: ${{ secrets.WEATHERKIT_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets yet — server not deployed. See server/README.md."
            exit 0
          fi
          # first deploy on a new account: the workers.dev subdomain has to exist (the dashboard asks interactively)
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          have=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | grep -o '"subdomain":"[^"]*"' || true)
          if [ -z "$have" ]; then
            for name in purrcast purrcast-app purrcast-weather "purrcast-${CLOUDFLARE_ACCOUNT_ID:0:6}"; do
              r=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$api" -d "{\"subdomain\":\"$name\"}")
              echo "$r" | grep -q '"success":true' && { echo "registered workers.dev subdomain: $name"; break; }
            done
          else echo "workers.dev subdomain already set: $have"; fi
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.txt
          test "${PIPESTATUS[0]}" -eq 0
          if [ -n "$KMA_SERVICE_KEY" ]; then echo "$KMA_SERVICE_KEY" | npx --yes wrangler@4 secret put KMA_SERVICE_KEY; fi
          # Apple WeatherKit (everywhere but Korea): key id, the .p8 file's text (multi-line, so printf, no trailing newline), team id
          if [ -n "$WEATHERKIT_KEY_ID" ]; then printf '%s' "$WEATHERKIT_KEY_ID" | npx --yes wrangler@4 secret put WEATHERKIT_KEY_ID; fi
          if [ -n "$WEATHERKIT_KEY_P8" ]; then printf '%s' "$WEATHERKIT_KEY_P8" | npx --yes wrangler@4 secret put WEATHERKIT_KEY_P8; fi
          if [ -n "$APPLE_TEAM_ID" ]; then printf '%s' "$APPLE_TEAM_ID" | npx --yes wrangler@4 secret put APPLE_TEAM_ID; fi
          url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.txt | head -1)
          echo "Deployed: ${url:-?}" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" > ../url.txt
      - name: Smoke test the live server (URL + /health + one Seoul scene, published to the server-deploy branch)
        run: |
          url=$(cat url.txt); mkdir -p out; echo "$url" > out/url.txt
          sleep 8
          curl -s -m 20 "$url/health?deep=1" > out/health.json || echo '{"error":"health request failed"}' > out/health.json
          curl -s -m 25 "$url/v1/forecast?lat=37.5663&lon=126.9019&plan=plus&name=%EC%84%9C%EC%9A%B8%20%EB%A7%88%ED%8F%AC%EA%B5%AC" | head -c 4000 > out/seoul.json || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} $(date -u)" > out/RUN.txt
          cd out && git init -q && git checkout -q -b server-deploy
          git add -A && git -c user.name=ci -c user.email=ci@purrcast commit -q -m "deploy ${{ github.run_id }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} server-deploy
