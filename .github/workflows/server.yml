name: Server

on:
  push:
    branches: [main]
    paths: ['server/**', 'Shared/Data/scenes.json', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tests (fake upstreams)
        working-directory: server
        run: node --test test/*.test.js
      - name: Live check against MET Norway (and 기상청 / WeatherKit when the keys are set)
        working-directory: server
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          WEATHERKIT_KEY_ID: ${{ secrets.WEATHERKIT_KEY_ID }}
          WEATHERKIT_KEY_P8: ${{ secrets.WEATHERKIT_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/live-check.mjs | tee live.txt
      - name: Publish the live check
        if: always()
        run: |
          mkdir -p out && cp server/live.txt out/ 2>/dev/null || echo "live check did not run" > out/live.txt
          echo "run=${{ github.run_id }} sha=${{ github.sha }} $(date -u)" > out/RUN.txt
          cd out && git init -q && git checkout -q -b server-output
          git add -A && git -c user.name=ci -c user.email=ci@purrcast commit -q -m "server check ${{ github.run_id }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} server-output

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy to Cloudflare (skipped until the secrets exist)
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          AIRKOREA_SERVICE_KEY: ${{ secrets.AIRKOREA_SERVICE_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          WEATHERKIT_KEY_ID: ${{ secrets.WEATHERKIT_KEY_ID }}
          WEATHERKIT_KEY_P8: ${{ secrets.WEATHERKIT_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets yet — server not deployed. See server/README.md."
            exit 0
          fi
          # first deploy on a new account: the workers.dev subdomain has to exist (the dashboard asks interactively)
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          have=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | grep -o '"subdomain":"[^"]*"' || true)
          if [ -z "$have" ]; then
            for name in purrcast purrcast-app purrcast-weather "purrcast-${CLOUDFLARE_ACCOUNT_ID:0:6}"; do
              r=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$api" -d "{\"subdomain\":\"$name\"}")
              echo "$r" | grep -q '"success":true' && { echo "registered workers.dev subdomain: $name"; break; }
            done
          else echo "workers.dev subdomain already set: $have"; fi
          # the free plan's one Apple forecast a day (KV namespace FREE_DAY): find it or create it, then bind it for this deploy
          kv="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          pick='let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const r=j.result;const n=Array.isArray(r)?r.find((x)=>x.title==="purrcast-free-day"):r;console.log(n&&n.id?n.id:"")}catch{console.log("")}})'
          kvid=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$kv?per_page=100" | node -e "$pick")
          if [ -z "$kvid" ]; then
            kvid=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$kv" -d '{"title":"purrcast-free-day"}' | node -e "$pick")
          fi
          if [ -n "$kvid" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "FREE_DAY"\nid = "%s"\n' "$kvid" >> wrangler.toml
            echo "FREE_DAY: bound" > ../kv.txt
          else
            echo "::warning::No FREE_DAY KV namespace (the Cloudflare API token needs Workers KV Storage: Edit) — free outside Korea refreshes every 30 min"
            echo "FREE_DAY: could not create (token needs Workers KV Storage: Edit)" > ../kv.txt
          fi
          # the Live Activity device registry (KV namespace DEVICES), found or created the same way
          devid=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$kv?per_page=100" | node -e "${pick//purrcast-free-day/purrcast-devices}")
          if [ -z "$devid" ]; then
            devid=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$kv" -d '{"title":"purrcast-devices"}' | node -e "${pick//purrcast-free-day/purrcast-devices}")
          fi
          if [ -n "$devid" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "DEVICES"\nid = "%s"\n' "$devid" >> wrangler.toml
            echo "DEVICES: bound" >> ../kv.txt
          else
            echo "::warning::No DEVICES KV namespace — Live Activities off"
          fi
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.txt
          test "${PIPESTATUS[0]}" -eq 0
          if [ -n "$KMA_SERVICE_KEY" ]; then echo "$KMA_SERVICE_KEY" | npx --yes wrangler@4 secret put KMA_SERVICE_KEY; fi
          # 미세먼지: 에어코리아 (Korea; the same data.go.kr key once approved) and OpenWeather (elsewhere)
          if [ -n "$AIRKOREA_SERVICE_KEY" ]; then printf '%s' "$AIRKOREA_SERVICE_KEY" | npx --yes wrangler@4 secret put AIRKOREA_SERVICE_KEY; fi
          if [ -n "$OPENWEATHER_KEY" ]; then printf '%s' "$OPENWEATHER_KEY" | npx --yes wrangler@4 secret put OPENWEATHER_KEY; fi
          # Apple WeatherKit (everywhere but Korea): key id, the .p8 file's text (multi-line, so printf, no trailing newline), team id
          if [ -n "$WEATHERKIT_KEY_ID" ]; then printf '%s' "$WEATHERKIT_KEY_ID" | npx --yes wrangler@4 secret put WEATHERKIT_KEY_ID; fi
          if [ -n "$WEATHERKIT_KEY_P8" ]; then printf '%s' "$WEATHERKIT_KEY_P8" | npx --yes wrangler@4 secret put WEATHERKIT_KEY_P8; fi
          if [ -n "$APPLE_TEAM_ID" ]; then printf '%s' "$APPLE_TEAM_ID" | npx --yes wrangler@4 secret put APPLE_TEAM_ID; fi
          # APNs (Live Activities): the key's .p8 text and its id
          if [ -n "$APNS_KEY" ]; then printf '%s' "$APNS_KEY" | npx --yes wrangler@4 secret put APNS_KEY; fi
          if [ -n "$APNS_KEY_ID" ]; then printf '%s' "$APNS_KEY_ID" | npx --yes wrangler@4 secret put APNS_KEY_ID; fi
          url=$(grep -o 'https://[a-z0-9.-]*workers.dev' deploy.txt | head -1)
          echo "Deployed: ${url:-?}" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" > ../url.txt
      - name: Smoke test the live server (URL + /health + one Seoul scene, published to the server-deploy branch)
        run: |
          url=$(cat url.txt); mkdir -p out; echo "$url" > out/url.txt
          cp kv.txt out/kv.txt 2>/dev/null || true
          sleep 8
          curl -s -m 20 "$url/health?deep=1" > out/health.json || echo '{"error":"health request failed"}' > out/health.json
          curl -s -m 25 "$url/v1/forecast?lat=37.5663&lon=126.9019&region=kr&tz=Asia/Seoul&plan=plus&lang=ko&name=%EC%84%9C%EC%9A%B8%20%EB%A7%88%ED%8F%AC%EA%B5%AC" > out/seoul.json || true
          curl -s -m 25 "$url/v1/forecast?lat=35.6938&lon=139.7034&region=jp&tz=Asia/Tokyo&plan=plus&lang=ja" > out/tokyo.json || true
          curl -s -m 25 "$url/v1/forecast?lat=35.6938&lon=139.7034&region=jp&tz=Asia/Tokyo&plan=free&lang=ja" > out/tokyo-free.json || true
          # which sources each answer used (main + 예보 비교)
          node -e 'for (const f of ["seoul","tokyo"]) { try { const s = require("./out/" + f + ".json"); console.log(f, "main", s.src, "· 비교", (s.cmp?.sources || []).map((x) => x.name + (x.main ? "*" : "")).join(", "), "·", s.temp + "°", s.cond, "· 미세먼지", s.dust ? s.dust.src + " " + s.dust.pm10 + "/" + s.dust.pm25 + " " + s.dust.note : "없음"); } catch (e) { console.log(f, "unreadable", e.message); } }' > out/sources.txt || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} $(date -u)" > out/RUN.txt
          cd out && git init -q && git checkout -q -b server-deploy
          git add -A && git -c user.name=ci -c user.email=ci@purrcast commit -q -m "deploy ${{ github.run_id }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} server-deploy
