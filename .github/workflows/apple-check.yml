# Looks at the app's bundle id in App Store Connect and turns on WeatherKit if it is off.
# Result goes to the apple-output branch (apple.txt), since logs cannot be read from the agent.
name: apple-check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: WeatherKit capability on app.purrcast.ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p out
          node scripts/asc-weatherkit.mjs --enable 2>&1 | tee out/apple.txt; true
          echo "run=${{ github.run_id }} $(date -u)" > out/RUN.txt
          cat out/apple.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b apple-output
          git add -A && git -c user.name=ci -c user.email=ci@purrcast commit -q -m "apple check ${{ github.run_id }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} apple-output
