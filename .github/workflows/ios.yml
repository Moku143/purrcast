name: iOS build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'server/**', '**/*.md', '.github/workflows/server.yml', '.github/workflows/testflight.yml', '.github/workflows/store-screenshots.yml', '.github/workflows/widget-matrix.yml']
  workflow_dispatch:
    inputs:
      only:
        description: 'Quick run: one screenshot test only (e.g. test10Layout, test3Scroll); the watch build is skipped'
        required: false
        default: ''
      device:
        description: 'Simulator device name (default iPhone 16; e.g. iPhone 13 — created on the latest iOS runtime when missing)'
        required: false
        default: 'iPhone 16'
      os:
        description: 'iOS runtime version (default: latest installed; e.g. 26.1 or 26.0 — a device on that runtime is created when missing)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 (the SDK TestFlight builds use, so the screenshots show what iOS 26 phones show)
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; else echo "::warning::No Xcode 26 on this runner, using the default"; fi
          xcodebuild -version && xcrun simctl list runtimes | head -5
      - name: Simulator device
        run: |
          dev="${{ github.event.inputs.device }}"; dev="${dev:-iPhone 16}"
          os="${{ github.event.inputs.os }}"
          xcrun simctl list runtimes | grep -E "^iOS"
          if [ -n "$os" ]; then
            # a device on that exact runtime, named after it, so the destination is unambiguous
            rt=$(xcrun simctl list runtimes | grep -E "^iOS $os" | tail -1 | grep -o "com.apple.CoreSimulator.SimRuntime[^ )]*")
            [ -n "$rt" ] || { echo "::error::no iOS $os runtime on this runner"; exit 1; }
            name="$dev iOS$os"
            xcrun simctl list devices available | grep -q "^ *$name (" || xcrun simctl create "$name" "$dev" "$rt"
            echo "SIM_DEVICE=$name" >> "$GITHUB_ENV"; echo "SIM_OS=$os" >> "$GITHUB_ENV"
          else
            if ! xcrun simctl list devices available | grep -q "^ *$dev ("; then
              rt=$(xcrun simctl list runtimes | grep -E "^iOS" | tail -1 | grep -o "com.apple.CoreSimulator.SimRuntime[^ )]*")
              xcrun simctl create "$dev" "$dev" "$rt" && echo "created $dev on $rt"
            fi
            echo "SIM_DEVICE=$dev" >> "$GITHUB_ENV"; echo "SIM_OS=latest" >> "$GITHUB_ENV"
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (simulator)
        run: |
          set -o pipefail
          xcodebuild build -project Purrcast.xcodeproj -scheme Purrcast \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE:-iPhone 16},OS=${SIM_OS:-latest}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD " || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Screenshot tests
        if: success()
        run: |
          set -o pipefail
          only=""
          if [ -n "${{ github.event.inputs.only }}" ]; then only="-only-testing:PurrcastUITests/ScreenshotTests/${{ github.event.inputs.only }} -only-testing:PurrcastTests"; fi
          xcodebuild test -project Purrcast.xcodeproj -scheme Purrcast $only \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE:-iPhone 16},OS=${SIM_OS:-latest}" \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case|TEST " || true
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p raw shots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path raw 2>/dev/null || true
            # name the files after the test's attachment names (manifest.json maps them)
            python3 - <<'PY'
          import json, os, shutil
          try:
              m = json.load(open('raw/manifest.json'))
          except Exception:
              m = []
          for t in m:
              for a in t.get('attachments', []):
                  src = os.path.join('raw', a['exportedFileName'])
                  # pictures only: Xcode also attaches screen recordings of UI tests (too big for the branch)
                  ext = os.path.splitext(a['exportedFileName'])[1].lower()
                  if ext not in ('.png', '.jpg', '.jpeg', '.json', '') or os.path.getsize(src) > 20_000_000:
                      continue
                  name = a.get('suggestedHumanReadableName') or a['exportedFileName']
                  name = name.split('_0_')[0].replace(' ', '-')
                  want = '.json' if ext == '.json' else '.png'
                  if not name.endswith(want): name += want
                  shutil.copy(os.path.join('raw', a['exportedFileName']), os.path.join('shots', name))
          print(len(os.listdir('shots')), 'screenshots')
          PY
          fi
      - name: Watch app build and screenshots
        if: always() && github.event.inputs.only == ''
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Purrcast.xcodeproj -scheme PurrcastWatch \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath wdd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee watch.log | grep -E "error:|BUILD " || true
          grep -q "BUILD SUCCEEDED" watch.log
          APP=$(find wdd/Build/Products -maxdepth 2 -name "PurrcastWatch.app" | head -1)
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'watchOS' in k for x in v))")
          echo "watch sim $DEV app $APP"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || sleep 30
          xcrun simctl install "$DEV" "$APP"
          for sc in maybe winter_cold summer_heat; do
            xcrun simctl launch --terminate-running-process "$DEV" app.purrcast.ios.watchkitapp -scene $sc -char brit || true
            sleep 8
            xcrun simctl io "$DEV" screenshot "shots/watch-$sc.png" || true
          done
          # in Korean: every page (now · hours · 10 days) and the free (locked) screen
          shot() { xcrun simctl launch --terminate-running-process "$DEV" app.purrcast.ios.watchkitapp "${@:2}" || true; sleep 8; xcrun simctl io "$DEV" screenshot "shots/$1.png" || true; }
          shot watch-ko-now -lang ko -scene maybe -char cat -page 0
          shot watch-ko-rain -lang ko -scene seoul_soon -char cat -page 0
          shot watch-ko-night -lang ko -scene summer_night -char abys -page 0
          shot watch-ko-snow -lang ko -scene winter_snow -char brit -page 0
          shot watch-ko-hours -lang ko -scene maybe -char cat -page 1
          shot watch-ko-days -lang ko -scene maybe -char cat -page 2
          shot watch-ko-locked -lang ko -scene maybe -char cat -locked
      - name: Publish results to the ci-output branch
        if: always()
        run: |
          mkdir -p out && cp -r shots out/ 2>/dev/null || true
          cp build.log test.log watch.log out/ 2>/dev/null || true
          grep -E "error:|warning: unre" build.log > out/errors.txt 2>/dev/null || true
          grep -E "error:" watch.log | sed 's/^/[watch] /' >> out/errors.txt 2>/dev/null || true
          grep -E "error:|failed|Test Case" test.log >> out/errors.txt 2>/dev/null || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} device=${SIM_DEVICE} os=${SIM_OS} $(date -u)" > out/RUN.txt
          cd out && git init -q && git checkout -q -b ci-output
          git -c user.name=ci -c user.email=ci@purrcast config core.autocrlf false
          git add -A && git -c user.name=ci -c user.email=ci@purrcast commit -q -m "ci output ${{ github.run_id }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} ci-output
