name: iOS build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'server/**', '**/*.md', '.github/workflows/server.yml', '.github/workflows/testflight.yml', '.github/workflows/store-screenshots.yml', '.github/workflows/widget-matrix.yml']
  workflow_dispatch:
    inputs:
      only:
        description: 'Quick run: one screenshot test only (e.g. test10Layout, test3Scroll); the watch build is skipped'
        required: false
        default: ''
      device:
        description: 'Simulator device name (default iPhone 16; e.g. iPhone 13 — created on the latest iOS runtime when missing)'
        required: false
        default: 'iPhone 16'
      os:
        description: 'iOS runtime version (default: latest installed; e.g. 26.1 or 26.0 — a device on that runtime is created when missing)'
        required: false
        default: ''
      watch_e2e:
        description: 'yes: only the watch end-to-end run (paired iPhone + Watch simulators, phone → watch over WatchConnectivity, both screens recorded to the watch-e2e branch)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    if: github.event.inputs.watch_e2e != 'yes'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 (the SDK TestFlight builds use, so the screenshots show what iOS 26 phones show)
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; else echo "::warning::No Xcode 26 on this runner, using the default"; fi
          xcodebuild -version && xcrun simctl list runtimes | head -5
      - name: Simulator device
        run: |
          dev="${{ github.event.inputs.device }}"; dev="${dev:-iPhone 16}"
          os="${{ github.event.inputs.os }}"
          xcrun simctl list runtimes | grep -E "^iOS"
          if [ -n "$os" ]; then
            # a device on that exact runtime, named after it, so the destination is unambiguous
            rt=$(xcrun simctl list runtimes | grep -E "^iOS $os" | tail -1 | grep -o "com.apple.CoreSimulator.SimRuntime[^ )]*")
            [ -n "$rt" ] || { echo "::error::no iOS $os runtime on this runner"; exit 1; }
            name="$dev iOS$os"
            xcrun simctl list devices available | grep -q "^ *$name (" || xcrun simctl create "$name" "$dev" "$rt"
            echo "SIM_DEVICE=$name" >> "$GITHUB_ENV"; echo "SIM_OS=$os" >> "$GITHUB_ENV"
          else
            if ! xcrun simctl list devices available | grep -q "^ *$dev ("; then
              rt=$(xcrun simctl list runtimes | grep -E "^iOS" | tail -1 | grep -o "com.apple.CoreSimulator.SimRuntime[^ )]*")
              xcrun simctl create "$dev" "$dev" "$rt" && echo "created $dev on $rt"
            fi
            echo "SIM_DEVICE=$dev" >> "$GITHUB_ENV"; echo "SIM_OS=latest" >> "$GITHUB_ENV"
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (simulator)
        run: |
          set -o pipefail
          xcodebuild build -project Purrcast.xcodeproj -scheme Purrcast \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE:-iPhone 16},OS=${SIM_OS:-latest}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD " || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Screenshot tests
        if: success()
        run: |
          set -o pipefail
          only=""
          if [ -n "${{ github.event.inputs.only }}" ]; then only="-only-testing:PurrcastUITests/ScreenshotTests/${{ github.event.inputs.only }} -only-testing:PurrcastTests"; fi
          xcodebuild test -project Purrcast.xcodeproj -scheme Purrcast $only \
            -destination "platform=iOS Simulator,name=${SIM_DEVICE:-iPhone 16},OS=${SIM_OS:-latest}" \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case|TEST " || true
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p raw shots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path raw 2>/dev/null || true
            # name the files after the test's attachment names (manifest.json maps them)
            python3 - <<'PY'
          import json, os, shutil
          try:
              m = json.load(open('raw/manifest.json'))
          except Exception:
              m = []
          for t in m:
              for a in t.get('attachments', []):
                  src = os.path.join('raw', a['exportedFileName'])
                  # pictures only: Xcode also attaches screen recordings of UI tests (too big for the branch)
                  ext = os.path.splitext(a['exportedFileName'])[1].lower()
                  if ext not in ('.png', '.jpg', '.jpeg', '.json', '') or os.path.getsize(src) > 20_000_000:
                      continue
                  name = a.get('suggestedHumanReadableName') or a['exportedFileName']
                  name = name.split('_0_')[0].replace(' ', '-')
                  want = '.json' if ext == '.json' else '.png'
                  if not name.endswith(want): name += want
                  shutil.copy(os.path.join('raw', a['exportedFileName']), os.path.join('shots', name))
          print(len(os.listdir('shots')), 'screenshots')
          PY
          fi
      - name: Watch app build and screenshots
        if: always() && github.event.inputs.only == ''
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build -project Purrcast.xcodeproj -scheme PurrcastWatch \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath wdd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee watch.log | grep -E "error:|BUILD " || true
          grep -q "BUILD SUCCEEDED" watch.log
          APP=$(find wdd/Build/Products -maxdepth 2 -name "PurrcastWatch.app" | head -1)
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'watchOS' in k for x in v))")
          echo "watch sim $DEV app $APP"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b || sleep 30
          xcrun simctl install "$DEV" "$APP"
          for sc in maybe winter_cold summer_heat; do
            xcrun simctl launch --terminate-running-process "$DEV" app.purrcast.ios.watchkitapp -scene $sc -char brit || true
            sleep 8
            xcrun simctl io "$DEV" screenshot "shots/watch-$sc.png" || true
          done
          # in Korean: every page (now · hours · 10 days) and the free (locked) screen
          shot() { xcrun simctl launch --terminate-running-process "$DEV" app.purrcast.ios.watchkitapp "${@:2}" || true; sleep 8; xcrun simctl io "$DEV" screenshot "shots/$1.png" || true; }
          shot watch-ko-now -lang ko -scene maybe -char cat -page 0
          shot watch-ko-rain -lang ko -scene seoul_soon -char cat -page 0
          shot watch-ko-night -lang ko -scene summer_night -char abys -page 0
          shot watch-ko-snow -lang ko -scene winter_snow -char brit -page 0
          shot watch-ko-hours -lang ko -scene maybe -char cat -page 1
          shot watch-ko-days -lang ko -scene maybe -char cat -page 2
          shot watch-ko-locked -lang ko -scene maybe -char cat -locked
      - name: Publish results to the ci-output branch
        if: always()
        run: |
          mkdir -p out && cp -r shots out/ 2>/dev/null || true
          cp build.log test.log watch.log out/ 2>/dev/null || true
          grep -E "error:|warning: unre" build.log > out/errors.txt 2>/dev/null || true
          grep -E "error:" watch.log | sed 's/^/[watch] /' >> out/errors.txt 2>/dev/null || true
          grep -E "error:|failed|Test Case" test.log >> out/errors.txt 2>/dev/null || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} device=${SIM_DEVICE} os=${SIM_OS} $(date -u)" > out/RUN.txt
          cd out && git init -q && git checkout -q -b ci-output
          git -c user.name=ci -c user.email=ci@purrcast config core.autocrlf false
          git add -A && git -c user.name=ci -c user.email=ci@purrcast commit -q -m "ci output ${{ github.run_id }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} ci-output

  # Paired iPhone + Apple Watch simulators: the iPhone app (with the watch app inside, as the App Store ships it) is
  # installed on the phone, the phone app sends its forecast over WatchConnectivity, and the watch app — started with
  # no example data of its own — shows what arrived. Both screens are recorded to the watch-e2e branch.
  #   1. phone: Plus, 비 (spring_rain), 고양이 → watch: now · hours · 10 days
  #   2. phone changes to 눈 (winter_snow), 브리티시 → the open watch app follows
  #   3. phone without Plus → the watch shows its Plus screen
  watch-e2e:
    if: github.event.inputs.watch_e2e == 'yes'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] && sudo xcode-select -s "$latest"; xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: Build the iPhone app (the watch app is built and embedded with it)
        run: |
          set -o pipefail
          xcodebuild build -project Purrcast.xcodeproj -scheme Purrcast -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|BUILD " || true
          grep -q "BUILD SUCCEEDED" build.log
          APP=dd/Build/Products/Debug-iphonesimulator/Purrcast.app
          ls "$APP/Watch" || { echo "::error::no watch app inside the iPhone app"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Paired simulators
        run: |
          IOS_RT=$(xcrun simctl list runtimes | grep -E "^iOS" | tail -1 | grep -o "com.apple.CoreSimulator.SimRuntime[^ )]*")
          WOS_RT=$(xcrun simctl list runtimes | grep -E "^watchOS" | tail -1 | grep -o "com.apple.CoreSimulator.SimRuntime[^ )]*")
          WTYPE=$(xcrun simctl list devicetypes | grep -E "Apple Watch Series (1[0-9]) \(46mm\)" | tail -1 | grep -o "com.apple.CoreSimulator.SimDeviceType[^ )]*")
          [ -n "$WTYPE" ] || WTYPE=$(xcrun simctl list devicetypes | grep -E "Apple Watch Series" | tail -1 | grep -o "com.apple.CoreSimulator.SimDeviceType[^ )]*")
          echo "iOS $IOS_RT · watchOS $WOS_RT · $WTYPE"
          P=$(xcrun simctl create "E2E iPhone" "iPhone 16" "$IOS_RT")
          W=$(xcrun simctl create "E2E Watch" "$WTYPE" "$WOS_RT")
          PAIR=$(xcrun simctl pair "$W" "$P")
          echo "phone $P · watch $W · pair $PAIR"
          xcrun simctl boot "$P"; xcrun simctl boot "$W"
          xcrun simctl bootstatus "$P" -b; xcrun simctl bootstatus "$W" -b
          xcrun simctl pair_activate "$PAIR" || true
          xcrun simctl list pairs
          echo "P=$P" >> "$GITHUB_ENV"; echo "W=$W" >> "$GITHUB_ENV"
      - name: Install (the phone installs its watch app on the paired watch)
        run: |
          xcrun simctl install "$P" "$APP"
          sleep 20
          if xcrun simctl listapps "$W" | grep -q "app.purrcast.ios.watchkitapp"; then echo "watch app installed by the phone"; echo "COMPANION=yes" >> "$GITHUB_ENV"
          else echo "::warning::the phone did not install the watch app; installing it directly"; xcrun simctl install "$W" "$APP"/Watch/*.app; echo "COMPANION=no" >> "$GITHUB_ENV"; fi
          xcrun simctl listapps "$W" | grep -i purrcast || true
      - name: Run and record
        run: |
          mkdir -p out
          xcrun simctl io "$W" recordVideo --codec=h264 --force out/watch.mp4 & WREC=$!
          xcrun simctl io "$P" recordVideo --codec=h264 --force out/phone.mp4 & PREC=$!
          sleep 3
          L='-AppleLanguages (ko) -AppleLocale ko_KR'
          note() { echo "$(date +%T) $*" | tee -a out/steps.txt; }
          shotw() { xcrun simctl io "$W" screenshot "out/$1-watch.png" >/dev/null 2>&1 || true; xcrun simctl io "$P" screenshot "out/$1-phone.png" >/dev/null 2>&1 || true; }

          note "1. phone: Plus · 비 · 고양이"
          xcrun simctl launch --terminate-running-process "$P" app.purrcast.ios -scene spring_rain -plus -char cat $L
          sleep 15
          note "   watch app opens with no example data: what the phone sent"
          xcrun simctl launch --terminate-running-process "$W" app.purrcast.ios.watchkitapp
          sleep 10; shotw 1-now
          xcrun simctl launch --terminate-running-process "$W" app.purrcast.ios.watchkitapp -page 1
          sleep 6; shotw 1-hours
          xcrun simctl launch --terminate-running-process "$W" app.purrcast.ios.watchkitapp -page 2
          sleep 6; shotw 1-days
          xcrun simctl launch --terminate-running-process "$W" app.purrcast.ios.watchkitapp
          sleep 5

          note "2. phone changes to 눈 · 브리티시 (the watch app stays open)"
          xcrun simctl launch --terminate-running-process "$P" app.purrcast.ios -scene winter_snow -plus -char brit $L
          sleep 20; shotw 2-snow

          note "3. phone without Plus"
          xcrun simctl launch --terminate-running-process "$P" app.purrcast.ios -scene winter_snow -char brit $L
          sleep 20; shotw 3-free

          kill -INT $WREC $PREC; wait $WREC $PREC 2>/dev/null || true
          # what each side's WatchConnectivity said (WatchBridge / WatchLink log under app.purrcast)
          xcrun simctl spawn "$P" log show --last 30m --info --predicate 'subsystem == "app.purrcast"' > out/phone-log.txt 2>&1 || true
          xcrun simctl spawn "$W" log show --last 30m --info --predicate 'subsystem == "app.purrcast"' > out/watch-log.txt 2>&1 || true
          xcrun simctl spawn "$P" log show --last 30m --predicate 'process == "Purrcast" AND (eventMessage CONTAINS[c] "WCSession" OR eventMessage CONTAINS[c] "watch")' > out/phone-wc.txt 2>&1 || true
          tail -20 out/phone-log.txt out/watch-log.txt
          ls -la out
      - name: Side by side
        if: always() && false
        run: |
          brew install ffmpeg >/dev/null 2>&1 || true
          if [ -f out/phone.mp4 ] && [ -f out/watch.mp4 ] && command -v ffmpeg >/dev/null; then
            ffmpeg -y -loglevel error -i out/phone.mp4 -i out/watch.mp4 -filter_complex \
              "[0:v]scale=-2:900,fps=15[p];[1:v]scale=-2:520,fps=15,pad=iw+60:900:30:190:color=0x1A1A22[w];[p][w]hstack=inputs=2,format=yuv420p" \
              -c:v libx264 -crf 30 -preset veryfast out/side-by-side.mp4 || true
          fi
          ls -la out
      - name: Publish to the watch-e2e branch
        if: always()
        run: |
          echo "run=${{ github.run_id }} sha=${{ github.sha }} companion=${COMPANION:-?} $(date -u)" > out/RUN.txt
          cp build.log out/ 2>/dev/null || true
          find out -size +45M -delete
          cd out && git init -q && git checkout -q -b watch-e2e
          git add -A && git -c user.name=ci -c user.email=ci@purrcast commit -q -m "watch e2e ${{ github.run_id }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} watch-e2e
