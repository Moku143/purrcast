name: TestFlight

# Manual: Actions → TestFlight → Run workflow.
# Needs four repository secrets (Settings → Secrets and variables → Actions), all from App Store Connect after
# joining the Apple Developer Program:
#   APPLE_TEAM_ID       10-character team id (Membership page)
#   ASC_KEY_ID          App Store Connect API key id (Users and Access → Integrations → App Store Connect API, role "App Manager")
#   ASC_ISSUER_ID       the issuer id shown on the same page
#   ASC_KEY_P8          the downloaded AuthKey_XXXX.p8 pasted as is (the whole file, BEGIN … END lines included)
# and one repository *variable* (same page, "Variables" tab):
#   SERVER_URL          the forecast server, e.g. https://purrcast.<you>.workers.dev  (without it the build is refused:
#                       a store build must never run on example weather)
# Xcode signs with the API key itself (cloud signing), so no certificates or profiles have to be exported.

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 (App Store Connect only takes builds made with the iOS 26 SDK)
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] || { echo "::error::No Xcode 26 on this runner"; ls /Applications | grep Xcode; exit 1; }
          sudo xcode-select -s "$latest" && xcodebuild -version
      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in TEAM KEY ISS P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v — see the comment at the top of testflight.yml"; exit 1; fi
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project with the team id and the server
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          SERVER: ${{ vars.SERVER_URL || 'https://purrcast.oo0785.workers.dev' }}
        run: |
          case "$SERVER" in https://*) ;; *) echo "::error::Set the SERVER_URL repository variable (https://…) — see the top of testflight.yml"; exit 1;; esac
          curl -fsS "$SERVER/health" || { echo "::error::$SERVER/health does not answer"; exit 1; }
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"$TEAM\"/" project.yml
          sed -i '' "s#PurrcastServerURL: \"\"#PurrcastServerURL: \"$SERVER\"#g" project.yml
          # build number = run number, so every upload is new
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect
          printf '%s\n' "$P8" > ~/.appstoreconnect/AuthKey.p8
          grep -q "BEGIN PRIVATE KEY" ~/.appstoreconnect/AuthKey.p8 || { echo "::error::ASC_KEY_P8 must be the .p8 file contents"; exit 1; }
      - name: Archive
        env:
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +e
          # the archive itself is built unsigned (a team with no registered device cannot make development
          # profiles); the export step signs it for the App Store with cloud signing, which needs no device
          xcodebuild archive -project Purrcast.xcodeproj -scheme Purrcast -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Purrcast.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee archive.log | tail -40; st=${PIPESTATUS[0]}; true
          # the reasons, as annotations (readable without opening the log)
          grep -E "error:|Error:|No profiles|No signing|Provisioning|not registered|requires a" archive.log | sort -u | head -12 | while read -r l; do echo "::error::${l:0:300}"; done
          exit $st
      - name: Upload to TestFlight
        env:
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          sed "s/TEAM_ID/$TEAM/" Config/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/Purrcast.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/AuthKey.p8 \
            -authenticationKeyID "$KEY" -authenticationKeyIssuerID "$ISS" 2>&1 | tee export.log | tail -40; st=${PIPESTATUS[0]}; true
          grep -E "error:|Error:|No profiles|No signing|Provisioning|not registered|requires a|failed" export.log | sort -u | head -12 | while read -r l; do echo "::error::${l:0:300}"; done
          tail -25 export.log | while read -r l; do echo "::notice::${l:0:300}"; done
          exit $st
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
