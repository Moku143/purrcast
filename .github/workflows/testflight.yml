name: TestFlight

# Manual: Actions → TestFlight → Run workflow.
# Needs four repository secrets (Settings → Secrets and variables → Actions), all from App Store Connect after
# joining the Apple Developer Program:
#   APPLE_TEAM_ID       10-character team id (Membership page)
#   ASC_KEY_ID          App Store Connect API key id (Users and Access → Integrations → App Store Connect API, role "App Manager")
#   ASC_ISSUER_ID       the issuer id shown on the same page
#   ASC_KEY_P8          the downloaded AuthKey_XXXX.p8 pasted as is (the whole file, BEGIN … END lines included)
# and one repository *variable* (same page, "Variables" tab):
#   SERVER_URL          the forecast server, e.g. https://purrcast.<you>.workers.dev  (without it the build is refused:
#                       a store build must never run on example weather)
# Xcode signs with the API key itself (cloud signing), so no certificates or profiles have to be exported.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 (App Store Connect only takes builds made with the iOS 26 SDK)
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$latest" ] || { echo "::error::No Xcode 26 on this runner"; ls /Applications | grep Xcode; exit 1; }
          sudo xcode-select -s "$latest" && xcodebuild -version
      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in TEAM KEY ISS P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v — see the comment at the top of testflight.yml"; exit 1; fi
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project with the team id and the server
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          SERVER: ${{ vars.SERVER_URL || 'https://purrcast.oo0785.workers.dev' }}
        run: |
          case "$SERVER" in https://*) ;; *) echo "::error::Set the SERVER_URL repository variable (https://…) — see the top of testflight.yml"; exit 1;; esac
          curl -fsS "$SERVER/health" || { echo "::error::$SERVER/health does not answer"; exit 1; }
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"$TEAM\"/" project.yml
          sed -i '' "s#PurrcastServerURL: \"\"#PurrcastServerURL: \"$SERVER\"#g" project.yml
          # build number = run number, so every upload is new
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate
      - name: API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect
          printf '%s\n' "$P8" > ~/.appstoreconnect/AuthKey.p8
          grep -q "BEGIN PRIVATE KEY" ~/.appstoreconnect/AuthKey.p8 || { echo "::error::ASC_KEY_P8 must be the .p8 file contents"; exit 1; }
      - name: Archive
        env:
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +e
          # the archive itself is built unsigned (a team with no registered device cannot make development
          # profiles); the export step signs it for the App Store with cloud signing, which needs no device
          xcodebuild archive -project Purrcast.xcodeproj -scheme Purrcast -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Purrcast.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee archive.log | tail -40; st=${PIPESTATUS[0]}; true
          # the reasons, as annotations (readable without opening the log)
          grep -E "error:|Error:|No profiles|No signing|Provisioning|not registered|requires a" archive.log | sort -u | head -12 | while read -r l; do echo "::error::${l:0:300}"; done
          exit $st
      - name: Entitlements into the archive (built unsigned; the export re-signs it and keeps these)
        run: |
          # Without this the App Group never reaches the build: the app and its widgets / watch could not share
          # the forecast ("앱을 열어 주세요" on the widget). Inner bundles first, the app last.
          A=build/Purrcast.xcarchive/Products/Applications/Purrcast.app
          ent() {
            case "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$1/Info.plist")" in
              app.purrcast.ios) echo Config/Purrcast.entitlements ;;
              app.purrcast.ios.widgets) echo Config/PurrcastWidgets.entitlements ;;
              app.purrcast.ios.watchkitapp) echo Config/PurrcastWatch.entitlements ;;
              app.purrcast.ios.watchkitapp.widgets) echo Config/PurrcastWatchWidgets.entitlements ;;
            esac
          }
          find "$A" -depth \( -name '*.appex' -o -name '*.app' \) | while read -r b; do
            e=$(ent "$b"); [ -n "$e" ] || { echo "::warning::no entitlements for $b"; continue; }
            codesign --force --sign - --entitlements "$e" --timestamp=none --generate-entitlement-der "$b" && echo "signed $(basename "$b") with $e"
          done
      - name: Upload to TestFlight
        env:
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          sed "s/TEAM_ID/$TEAM/" Config/ExportOptions.plist > build/ExportOptions.plist
          export_it() {
            xcodebuild -exportArchive -archivePath build/Purrcast.xcarchive \
              -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
              -allowProvisioningUpdates \
              -authenticationKeyPath ~/.appstoreconnect/AuthKey.p8 \
              -authenticationKeyID "$KEY" -authenticationKeyIssuerID "$ISS" > "$1" 2>&1
          }
          export_it export.log; st=$?
          if [ $st -ne 0 ] && grep -q "No profiles for\|Authentication failed" export.log; then
            # The App Groups (group.app.purrcast, group.app.purrcast.watch) are not set up on the bundle ids in the
            # developer portal yet, and the API key cannot do that part. Upload without them meanwhile: the app works,
            # only the widgets / complications cannot read its forecast.
            echo "::warning::Export with the App Group failed (App Groups not set up in the developer portal?) — uploading without it"
            grep -E "error:" export.log | sort -u | head -8 | while read -r l; do echo "::warning::${l:0:300}"; done
            find build/Purrcast.xcarchive/Products/Applications/Purrcast.app -depth \( -name '*.appex' -o -name '*.app' \) -exec codesign --remove-signature {} \;
            echo nogroup > build/NOGROUP
            export_it export2.log; st=$?; cat export2.log >> export.log
          fi
          tail -40 export.log
          grep -E "error:|Error:|No profiles|No signing|Provisioning|not registered|requires a|failed" export.log | sort -u | head -12 | while read -r l; do echo "::error::${l:0:300}"; done
          exit $st
      - name: What the uploaded build carries (entitlements per bundle → tf-output branch)
        if: always()
        env:
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # the upload export leaves no .ipa behind, so sign once more the same way into a local file and look inside
          sed "s/TEAM_ID/$TEAM/; s#<string>upload</string>#<string>export</string>#" Config/ExportOptions.plist > build/CheckOptions.plist
          xcodebuild -exportArchive -archivePath build/Purrcast.xcarchive -exportOptionsPlist build/CheckOptions.plist -exportPath build/check \
            -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/AuthKey.p8 \
            -authenticationKeyID "$KEY" -authenticationKeyIssuerID "$ISS" > check.log 2>&1 || true
          mkdir -p tfout; ipa=$(ls build/check/*.ipa 2>/dev/null | head -1)
          { echo "run=${{ github.run_id }} build=${{ github.run_number }} $(date -u)"
            [ -f build/NOGROUP ] && echo "APP GROUP: NOT IN THIS BUILD (export with it failed: $(grep -m1 -E 'error:' export.log))" || echo "APP GROUP: in the build"
            if [ -n "$ipa" ]; then
              rm -rf x && mkdir x && unzip -q "$ipa" -d x
              find x/Payload -depth \( -name '*.appex' -o -name '*.app' \) | while read -r b; do
                echo "== $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$b/Info.plist")"
                codesign -d --entitlements - --xml "$b" 2>/dev/null | plutil -convert json -o - - 2>/dev/null || echo "(no entitlements)"
                echo
              done
            else echo "no ipa (export failed)"; grep -E "error|Error" export.log check.log | head -20; fi
          } > tfout/entitlements.txt 2>&1
          cat tfout/entitlements.txt
          cd tfout && git init -q && git checkout -q -b tf-output && git add -A
          git -c user.name=ci -c user.email=ci@purrcast commit -q -m "testflight ${{ github.run_id }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} tf-output
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
