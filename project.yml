name: Purrcast
options:
  bundleIdPrefix: app.purrcast
  developmentLanguage: en
  knownRegions: [en, ko, ja]
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Purrcast:
    type: application
    platform: iOS
    sources:
      - path: Purrcast
      - path: Shared
      - path: WalkSprites      # the walking frames: the phone app and the watch app (not the widgets)
    info:
      path: Purrcast/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Purrcast
        CFBundleDevelopmentRegion: en
        UILaunchScreen: {}
        UIAppFonts: [PurrcastPixel-Medium.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: 지금 위치의 날씨를 보여 드리기 위해 필요해요.
        PurrcastServerURL: ""
    entitlements:
      path: Config/Purrcast.entitlements
      properties:
        com.apple.security.application-groups: [group.app.purrcast]
    dependencies:
      - target: PurrcastWidgets
        embed: true
      - target: PurrcastWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  PurrcastWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PurrcastWidgets
      - path: Shared
    info:
      path: PurrcastWidgets/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Purrcast
        UIAppFonts: [PurrcastPixel-Medium.ttf]
        PurrcastServerURL: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/PurrcastWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.purrcast]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  PurrcastWatch:
    type: application
    platform: watchOS
    sources:
      - path: PurrcastWatch
      - path: Shared
      - path: WalkSprites
    info:
      path: PurrcastWatch/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Purrcast
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.purrcast.ios
        WKRunsIndependentlyOfCompanionApp: false
        UIAppFonts: [PurrcastPixel-Medium.ttf]
        PurrcastServerURL: ""
    entitlements:
      path: Config/PurrcastWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.app.purrcast.watch]
    dependencies:
      - target: PurrcastWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  PurrcastWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: PurrcastWatchWidgets
      - path: Shared
    info:
      path: PurrcastWatchWidgets/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Purrcast
        UIAppFonts: [PurrcastPixel-Medium.ttf]
        PurrcastServerURL: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/PurrcastWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.purrcast.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  PurrcastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PurrcastTests
    dependencies:
      - target: Purrcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Purrcast.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Purrcast"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  PurrcastUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PurrcastUITests
    dependencies:
      - target: Purrcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios.uitests
        TEST_TARGET_NAME: Purrcast
schemes:
  Purrcast:
    build:
      targets:
        Purrcast: all
        PurrcastTests: [test]
        PurrcastUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/Purrcast.storekit
    test:
      config: Debug
      targets: [PurrcastTests, PurrcastUITests]
  PurrcastWatch:
    build:
      targets:
        PurrcastWatch: all
    run:
      config: Debug
