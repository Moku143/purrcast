name: Purrcast
options:
  bundleIdPrefix: app.purrcast
  developmentLanguage: en
  knownRegions: [en, ko, ja, es, fr, de, pt-BR, it, id, ru, zh-Hans, zh-Hant]
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
# Ads for Free (Purrcast/App/Ads.swift). The package brings Google's consent SDK (UserMessagingPlatform) with it.
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 13.12.0
targets:
  Purrcast:
    type: application
    platform: iOS
    sources:
      - path: Purrcast
      - path: Shared
    info:
      path: Purrcast/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Purrcast
        CFBundleDevelopmentRegion: en
        UILaunchScreen: {}
        UIAppFonts: [PurrcastPixel-Medium.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        # best-effort refresh near midnight, so the day closes with where the phone is (no user prompt involved)
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.purrcast.ios.refresh]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: 지금 위치의 날씨를 보여 드리기 위해 필요해요.
        NSSupportsLiveActivities: true
        PurrcastServerURL: ""
        # AdMob (Ads.swift): the app's id, Apple's tracking prompt text (every language in InfoPlist.strings), and the
        # ad networks' install attribution ids from Google's own sample
        GADApplicationIdentifier: ca-app-pub-3820798685245860~8729194680
        NSUserTrackingUsageDescription: 맞춤 광고에 써요.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: k674qkevps.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: klf5c3l5u5.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: kbmxgpxpgc.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
    entitlements:
      path: Config/Purrcast.entitlements
      properties:
        com.apple.security.application-groups: [group.app.purrcast]
        aps-environment: development
        # 날씨 기록 in the person's own iCloud (CloudLog): CloudKit private database
        com.apple.developer.icloud-container-identifiers: [iCloud.app.purrcast.ios]
        com.apple.developer.icloud-services: [CloudKit]
    dependencies:
      - package: GoogleMobileAds
      - target: PurrcastWidgets
        embed: true
      - target: PurrcastWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # AppIcon (구름 조금) and the icons picked in 설정 › 앱 아이콘 (AppIcon.swift)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-sun-blue-abys AppIcon-sun-blue-brit AppIcon-sun-peach-cat AppIcon-sun-peach-abys AppIcon-sun-peach-brit AppIcon-partly AppIcon-clear AppIcon-cloudy AppIcon-rain AppIcon-thunder AppIcon-snow AppIcon-night AppIcon-fog AppIcon-rainbow AppIcon-wind AppIcon-heavyrain AppIcon-sleet AppIcon-heat AppIcon-cold AppIcon-dust AppIcon-cloudynight AppIcon-rain-cat AppIcon-rain-abys AppIcon-rain-brit"
  PurrcastWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PurrcastWidgets
      - path: Shared
    info:
      path: PurrcastWidgets/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Purrcast
        UIAppFonts: [PurrcastPixel-Medium.ttf]
        PurrcastServerURL: ""
        # "지금 위치" widgets look where the phone is (the app's when-in-use permission covers them)
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/PurrcastWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.purrcast]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  PurrcastWatch:
    type: application
    platform: watchOS
    sources:
      - path: PurrcastWatch
      - path: Shared
    info:
      path: PurrcastWatch/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Purrcast
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.purrcast.ios
        WKRunsIndependentlyOfCompanionApp: false
        UIAppFonts: [PurrcastPixel-Medium.ttf]
        PurrcastServerURL: ""
    entitlements:
      path: Config/PurrcastWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.app.purrcast.watch]
    dependencies:
      - target: PurrcastWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  PurrcastWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: PurrcastWatchWidgets
      - path: Shared
    info:
      path: PurrcastWatchWidgets/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Purrcast
        UIAppFonts: [PurrcastPixel-Medium.ttf]
        PurrcastServerURL: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/PurrcastWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.purrcast.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
  PurrcastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PurrcastTests
    dependencies:
      - target: Purrcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Purrcast.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Purrcast"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  PurrcastUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PurrcastUITests
    dependencies:
      - target: Purrcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios.uitests
        TEST_TARGET_NAME: Purrcast
schemes:
  Purrcast:
    build:
      targets:
        Purrcast: all
        PurrcastTests: [test]
        PurrcastUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/Purrcast.storekit
    test:
      config: Debug
      targets: [PurrcastTests, PurrcastUITests]
  PurrcastWatch:
    build:
      targets:
        PurrcastWatch: all
    run:
      config: Debug
