name: Purrcast
options:
  bundleIdPrefix: app.purrcast
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Purrcast:
    type: application
    platform: iOS
    sources:
      - path: Purrcast
      - path: Shared
    info:
      path: Purrcast/Info.plist
      properties:
        CFBundleDisplayName: Purrcast
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        UIAppFonts: [Galmuri11.ttf, Galmuri11-Bold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: 지금 위치의 날씨를 보여 드리기 위해 필요해요.
        PurrcastServerURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  PurrcastUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PurrcastUITests
    dependencies:
      - target: Purrcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.purrcast.ios.uitests
        TEST_TARGET_NAME: Purrcast
schemes:
  Purrcast:
    build:
      targets:
        Purrcast: all
        PurrcastUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/Purrcast.storekit
    test:
      config: Debug
      targets: [PurrcastUITests]
