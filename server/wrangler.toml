# Cloudflare Workers (free plan: 100,000 requests a day).
# Deploy: the "Server" GitHub workflow runs `wrangler deploy` once the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets exist. Keys go in as Worker secrets (the workflow copies KMA_SERVICE_KEY,
# WEATHERKIT_KEY_ID, WEATHERKIT_KEY_P8 and APPLE_TEAM_ID when they are set).
name = "purrcast"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# every half hour: the rain Live Activities of registered Plus devices (src/push.js) — needs DEVICES (KV, bound by the
# Server workflow like FREE_DAY) and the APNs key secrets APNS_KEY, APNS_KEY_ID, APPLE_TEAM_ID
[triggers]
crons = ["*/30 * * * *"]

[vars]
CONTACT = "oo0785@daum.net github.com/Moku143/purrcast"
WEATHERKIT_SERVICE_ID = "app.purrcast.ios"   # the WeatherKit service id = the app's bundle id (JWT `sub`)
# /health?deep=1 calls every upstream source: off unless set to "on" for a first deploy
DEEP_CHECK = "off"
# The gift event (/v1/promo → the app's home banner, Promo.swift; only 1.2.1 and later show it). 출시 기념: 1.2.1 came
# out on 2026-11-13, so it runs until the end of 12월 13일 KST (31 days); the App Store event card has the same dates.
# Without PROMO, or past the end: off.
PROMO = '{"id":"capy-launch","char":"capy","kind":"launch","end":"2026-12-14T00:00:00+09:00"}'

# Rate limits (Workers Rate Limiting binding, wrangler 4.36+; per Cloudflare location, approximate).
# One device: its own id, so phones sharing a mobile carrier's IP do not limit each other.
[[ratelimits]]
name = "DEVICE_LIMIT"
namespace_id = "1001"
simple = { limit = 6, period = 60 }
# One address, generous (a carrier NAT puts many phones behind one IP): only against bulk calls.
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

# FREE_DAY (the free plan's one Apple forecast a day) is a KV namespace the Server workflow finds or creates and binds
# at deploy time, so no id is kept here.
# Optional "전일 대비" memory. Create once with:  npx wrangler kv namespace create HISTORY
# then uncomment and paste the id.
# [[kv_namespaces]]
# binding = "HISTORY"
# id = ""
